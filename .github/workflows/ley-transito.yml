name: Ley de Tránsito y UTM - actualizar datos oficiales

# Descarga el texto refundido vigente de la Ley 18.290 (DFL 1, 2009,
# idNorma 1007469) desde LeyChile (BCN) y, si cambió, lo deja en el repo.
on:
  push:
    paths:
      - ".github/workflows/ley-transito.yml"
      - "app-conductores/tool/ley/**"
  schedule:
    - cron: "17 10 * * 1"   # lunes 07:17 hora de Chile (aprox.)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ley-${{ github.ref }}

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar XML desde LeyChile
        run: |
          mkdir -p app-conductores/tool/ley/fuente
          curl -fsSL --retry 4 --retry-delay 5 \
            -A "Mozilla/5.0 (AppConductores; +https://github.com/${{ github.repository }})" \
            "https://www.leychile.cl/Consulta/obtxml?opt=7&idNorma=1007469" \
            -o app-conductores/tool/ley/fuente/ley_18290.xml
          head -c 600 app-conductores/tool/ley/fuente/ley_18290.xml; echo
          ls -l app-conductores/tool/ley/fuente

      - name: Descargar valor UTM
        # No detiene el proceso si la fuente falla: la app usa el último valor.
        continue-on-error: true
        run: |
          curl -fsSL --retry 4 --retry-delay 5 https://mindicador.cl/api/utm \
            -o app-conductores/tool/ley/fuente/utm_mindicador.json
          curl -fsSL --retry 2 -A "Mozilla/5.0" \
            "https://www.sii.cl/valores_y_fechas/utm/utm$(date +%Y).htm" \
            -o app-conductores/tool/ley/fuente/utm_sii.html || true
          mkdir -p app-conductores/assets/ley
          python3 app-conductores/tool/ley/utm.py \
            app-conductores/tool/ley/fuente/utm_mindicador.json \
            app-conductores/assets/ley/utm.json

      - name: Generar JSON para la app
        run: |
          if [ -f app-conductores/tool/ley/convertir.py ]; then
            python3 app-conductores/tool/ley/convertir.py \
              app-conductores/tool/ley/fuente/ley_18290.xml \
              app-conductores/assets/ley/ley_18290.json
          fi

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-conductores/tool/ley/fuente
          if [ -d app-conductores/assets/ley ]; then git add app-conductores/assets/ley; fi
          if git diff --cached --quiet; then
            echo "Sin cambios en la ley."
          else
            git commit -m "Actualizar texto de la Ley de Tránsito desde LeyChile"
            git push
          fi
